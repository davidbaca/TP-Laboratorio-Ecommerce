<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto Web E-Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
 <header>
</header>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Tienda</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <button class="btn btn-link nav-link active" type="button" id="all">All</button>
        </li>
        <li class="nav-item">
          <button class="btn btn-link nav-link" type="button" id="electronics">Electronics</button>
        </li>
        <li class="nav-item">
          <button class="btn btn-link nav-link" type="button" id="jewelery">Jewelery</button>
        </li>
        <li class="nav-item">
          <button class="btn btn-link nav-link" type="button" id="mens-clothing">Men's Clothing</button>
        </li>
        <li class="nav-item">
          <button class="btn btn-link nav-link" type="button" id="women-s-clothing">Women's Clothing</button>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-dark d-flex align-items-center" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
            <i class="bi bi-cart3"></i>
            <span></span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">
  <h1>Proyecto Web E-Commerce</h1>
  <input type="text" id="inputSearch" class="form-control mt-3" placeholder="Buscar productos...">
  <div class="row row-cols-1 row-cols-md-4 g-4 mt-5" id="product-list">
    <!-- Product cards will be dynamically inserted here -->
  </div>

  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true"></div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasRightLabel">Lista de compras</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body"></div>
    <div class="offcanvas-footer p-3 border-top d-flex gap-2">
      <button type="button" class="btn btn-primary" id="finishPurchaseBtn">Finalizar compra</button>
      <button type="button" class="btn btn-outline-secondary" id="clearCartBtn">Vaciar carrito</button>
    </div>
  </div>
</main>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    
    <footer class="text-center bg-dark text-white py-3 mt-5">
      <p>&copy; 2026 Proyecto Web E-Commerce - Laboratorio Aplicaciones Web Cliente - David Baca</p>
    
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./src/index.js"></script>
  </body>
</html>
